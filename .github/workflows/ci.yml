name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # PodMe changes its API without warning; a weekly run surfaces that before users do
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.6
      - name: ruff check
        run: ruff check --no-fix .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Tests (live PodMe API)
    runs-on: ubuntu-latest
    # The test signs in to a real PodMe account, so it only runs where the secrets
    # exist. Forked pull requests do not get them and skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp music-assistant-models podme-api==1.4.3
      - name: Provider end-to-end
        env:
          PODME_EMAIL: ${{ secrets.PODME_EMAIL }}
          PODME_PASSWORD: ${{ secrets.PODME_PASSWORD }}
          PODME_REGION: ${{ secrets.PODME_REGION }}
        run: |
          if [ -z "$PODME_EMAIL" ]; then
            echo "PODME_EMAIL secret not set - skipping live test."
            exit 0
          fi
          python tests/test_provider.py
