name: Publish image

on:
  push:
    branches: [main]
    paths:
      - "podme/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  schedule:
    # rebuild daily so the image tracks new Music Assistant server releases
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.channel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # each channel tracks the matching upstream server tag
        channel: [latest, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case the image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MA_VERSION=${{ matrix.channel }}
          # the run-id tag lets a deployment pin one build; for a guaranteed
          # immutable reference use the @sha256: digest instead
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.channel }}
            ${{ steps.image.outputs.name }}:${{ matrix.channel }}-${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}
