[project]
name = "ma-provider-podme"
version = "0.1.0"
description = "PodMe podcast provider for Music Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["podme-api==1.4.3"]

# The provider ships as a plain Music Assistant provider directory (podme/) and is
# not installed as a package - see README.md. This file exists so contributors lint
# with the same settings Music Assistant itself uses, keeping the code ready to
# upstream. The [tool.ruff] sections below are taken from the Music Assistant server
# repository (Apache-2.0).

[tool.ruff]
fix = true
show-fixes = true

line-length = 100
target-version = "py314"

[tool.ruff.lint.pydocstyle]
# Use Sphinx-style docstrings with :param: syntax
# pep257 is the base convention, we enforce Sphinx-style parameters separately
convention = "pep257"

[tool.ruff.lint.pylint]

max-args = 10
max-branches = 25
max-returns = 15
max-statements = 50

[tool.ruff.format]
# Force Linux/macOS line endings
line-ending = "lf"

[tool.ruff.lint]
ignore = [
  "ANN002", # Just annoying, not really useful
  "ANN003", # Just annoying, not really useful
  "ANN401", # Opinioated warning on disallowing dynamically typed expressions
  "D203", # Conflicts with other rules
  "D417", # False positives in some occasions
  "EM101", # Just annoying, not really useful
  "EM102", # Just annoying, not really useful
  "FIX002", # Just annoying, not really useful
  "PLR2004", # Just annoying, not really useful
  "PGH004", # Just annoying, not really useful
  "PD011", # Just annoying, not really useful
  "S101", # assert is often used to satisfy type checking
  "TC001", # Just annoying, not really useful
  "TC003", # Just annoying, not really useful
  "TD002", # Just annoying, not really useful
  "TD003", # Just annoying, not really useful
  "TD004", # Just annoying, not really useful
  "TRY003", # Just annoying, not really useful
  "TRY400", # Just annoying, not really useful
  "COM812", # Conflicts with the Ruff formatter
  "ASYNC109", # Not relevant, since we use helpers with configurable timeouts
  "ASYNC110", # Use `asyncio.Event` instead of awaiting `asyncio.sleep` in a `while` loop
  "N818", # Just annoying, not really useful
  "E501", # Handled by ruff formatter
  "ASYNC240", # Not relevant, we use asyncio not trio/anyio
  "UP047", # Not yet ready to migrate to type parameters
  "PLW0108", # Just annoying, not really useful
  "CPY001", # Just annoying, not really useful
  "LOG004", # Just annoying, not really useful
  "FURB110", # Just annoying, not really useful  # TEMPORARY DISABLED rules  # The below rules must be enabled later one-by-one !
  "BLE001",
  "FBT001",
  "FBT002",
  "FBT003",
  "ANN001",
  "ANN202",
  "PTH118",
  "PTH120",
  "PTH123",
  "G004",
  "S104",
  "S105",
  "S106",
  "SLF001",
  "SIM102",
  "PERF401",
  "ARG002",
  "S311",
  "TRY301",
  "PLR0912",
  "B904",
  "S324",
  "ERA001",
  "C901",
  "S304",
  "TRY300",
  "S608",
  "ANN204",
  "ISC004", # To implement later
  "PLR0917", # To implement later
]

select = ["ALL"]
# Enforce the multi-line docstring summary on the second line (the pep257 convention disables both
# D212 and D213; we re-enable D213 so our "summary starts on the next line" style is checked).
extend-select = ["D213"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["music_assistant", "podme"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# the test harness is a standalone script, not a pytest suite: it stubs modules,
# prints results and exits with a status code
"tests/*" = ["ALL"]
